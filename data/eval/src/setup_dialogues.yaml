# Setup-agent eval cases (hand-written). Tools: docs/CONVENTIONS.md § Setup tools.
# Each case: the project state before, the user turns, the expected tool calls (in order; args compared
# after normalisation) and the expected project fields afterwards (computed by code from the calls).
# `stage: locked` cases expect no state change (the tool refuses or the agent asks to start over).
# tags: single | multi_slot | imperial | correction | ambiguous_yarn | unknown_yarn | locked | no_tool | status

- id: s01
  stage: setup
  turns: ["I'm using YarnArt Jeans"]
  calls: [{tool: set_yarn, args: {name: "YarnArt Jeans"}}]
  tags: [single]
- id: s02
  stage: setup
  turns: ["my needles are 3.5 mm"]
  calls: [{tool: set_needles, args: {size: 3.5, system: mm}}]
  tags: [single]
- id: s03
  stage: setup
  turns: ["Swatch: 22 sts and 28 rows over 10 cm"]
  calls: [{tool: set_gauge, args: {stitches: 22, rows: 28, over: 10, unit: cm}}]
  tags: [single]
- id: s04
  stage: setup
  turns: ["I'll make size L"]
  sizes: [S, M, L]
  calls: [{tool: select_size, args: {size: L}}]
  tags: [single]
- id: s05
  stage: setup
  turns: ["I'm knitting with Alize Cotton Gold on 3.5mm needles and my gauge is 24 stitches per 10 cm"]
  calls:
    - {tool: set_yarn, args: {name: "Alize Cotton Gold"}}
    - {tool: set_needles, args: {size: 3.5, system: mm}}
    - {tool: set_gauge, args: {stitches: 24, rows: null, over: 10, unit: cm}}
  tags: [multi_slot]
- id: s06
  stage: setup
  turns: ["I got 18 stitches and 24 rows to 4 inches on US 8 needles"]
  calls:
    - {tool: set_gauge, args: {stitches: 18, rows: 24, over: 4, unit: in}}
    - {tool: set_needles, args: {size: 8, system: us}}
  tags: [multi_slot, imperial]
- id: s07
  stage: setup
  turns: ["I'll use some merino DK I have at home"]
  calls: [{tool: set_yarn, args: {name: null, fibre: merino, weight: DK}}]
  tags: [single]
- id: s08
  stage: setup
  turns: ["Yarn is DROPS Nepal", "Sorry, I meant DROPS Karisma"]
  calls:
    - {tool: set_yarn, args: {name: "DROPS Nepal"}}
    - {tool: set_yarn, args: {name: "DROPS Karisma"}}
  tags: [correction]
- id: s09
  stage: setup
  turns: ["4mm needles", "no wait, 4.5"]
  calls:
    - {tool: set_needles, args: {size: 4, system: mm}}
    - {tool: set_needles, args: {size: 4.5, system: mm}}
  tags: [correction]
- id: s10
  stage: setup
  turns: ["What's still missing before I can start?"]
  calls: [{tool: get_project_status, args: {}}]
  tags: [status]
- id: s11
  stage: setup
  turns: ["I have everything, generate my pattern"]
  calls: [{tool: generate_working_pattern, args: {}}]
  tags: [single]
- id: s12
  stage: setup
  turns: ["I'm using Jeans yarn"]
  calls: [{tool: set_yarn, args: {name: "Jeans"}}]
  expect_linker: ambiguous
  tags: [ambiguous_yarn]
- id: s13
  stage: setup
  turns: ["I'm using Rowan Felted Tweed"]
  calls: [{tool: set_yarn, args: {name: "Rowan Felted Tweed"}}]
  expect_linker: no_match
  tags: [unknown_yarn]
- id: s14
  stage: locked
  turns: ["I want to change my yarn to Nako Calico"]
  calls: [{tool: set_yarn, args: {name: "Nako Calico"}}]
  expect_state_change: false
  tags: [locked]
- id: s15
