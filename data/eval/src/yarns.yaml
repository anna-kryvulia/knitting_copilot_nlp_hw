# Yarn linker + yarn advisor eval cases (hand-written).
# Gold yarns are given as [brand, name] and resolved to yarn_id from data/yarns.csv by the build script,
# so a typo in this file fails the build instead of producing a wrong label.

# expect: one yarn | none (not in our table) | ambiguous (several candidates -> the system should ask)
mentions:
