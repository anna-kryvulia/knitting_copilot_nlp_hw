  - {text: "yarnart jeans", gold: [YarnArt, Jeans], tags: [case]}
  - {text: "Yarn Art Jeans", gold: [YarnArt, Jeans], tags: [spacing]}
  - {text: "Джинс YarnArt", gold: [YarnArt, Jeans], tags: [cyrillic]}
