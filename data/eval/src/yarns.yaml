# Advisor cases. Gold numbers (weight category, needle and gauge ranges) are computed by the build script
# from data/yarns.csv and data/kb/yarn_weights.yaml; `must_mention` are facts a correct answer contains
# (checked against the fibre KB); `warn_gauge` = the yarn's label gauge is flagged (Q9) and the answer
# must say the label value is unreliable / swatch first.
advice:
  - {yarn: [YarnArt, Jeans], question: "What needles and gauge for this yarn?", must_mention: [cotton, low elasticity], tags: [blend]}
  - {yarn: [Alize, Cotton Gold Solids], question: "Is it good for a summer top?", must_mention: [cotton], tags: [suitability]}
  - {yarn: [DROPS, DROPS Nepal], question: "What needles should I use?", must_mention: [wool], tags: [needles]}
  - {yarn: [DROPS, DROPS Kid-Silk], question: "Can I knit a scarf with this?", must_mention: [mohair, halo, hard to unravel], tags: [suitability]}
  - {yarn: [DROPS, DROPS Alpaca], question: "Is it good for a ribbed hat?", must_mention: [alpaca, low elasticity], tags: [suitability]}
  - {yarn: [Himalaya, Everyday], question: "How do I wash it?", must_mention: [acrylic, machine washable], warn_gauge: true, tags: [care, flagged_gauge]}
  - {yarn: [Himalaya, Deluxe Bamboo], question: "Which needles work best?", must_mention: [bamboo, slippery], tags: [needles]}
  - {yarn: [Nako, Calico], question: "What gauge should I expect?", must_mention: [cotton], tags: [gauge]}
  - {yarn: [Gazzal, Baby Wool], question: "Is it soft enough for a baby?", must_mention: [acrylic], tags: [suitability]}
  - {yarn: [Lana Grossa, Cool Wool], question: "Can I put it in the washing machine?", must_mention: [merino], tags: [care]}
  - {yarn: [Kartopu, Amigurumi], question: "What needle size?", must_mention: [acrylic], tags: [needles]}
  - {yarn: [Vizell, FAYNA], question: "Good for socks?", must_mention: [merino], tags: [suitability]}
  - {yarn: [Etrofil, Savona], question: "What gauge does it give?", must_mention: [wool], tags: [gauge]}
  - {yarn: [Madame Tricote, Camilla], question: "Will my ribbing stay stretchy?", must_mention: [cotton, low elasticity], tags: [suitability]}
  - {yarn: [YarnArt, Merino De Luxe], question: "What gauge does this yarn give?", must_mention: [merino], tags: [wide_gauge_range]}   # label 14.8-21.7 sts: answer must give the range
  - {yarn: [Nako, Pirlanta], question: "Which needles and gauge?", must_mention: [acrylic], warn_gauge: true, tags: [flagged_gauge]}
  - {yarn: [Himalaya, Super Soft], question: "What gauge?", must_mention: [acrylic], warn_gauge: true, tags: [flagged_gauge]}
  - {fibre: cotton, weight: DK, question: "What needles for a DK cotton?", must_mention: [cotton, go down a needle size], tags: [no_name]}
  - {fibre: wool, weight: Worsted, question: "Needles for worsted wool?", must_mention: [wool], tags: [no_name]}
  - {fibre: acrylic, weight: Aran, question: "What gauge for aran acrylic?", must_mention: [acrylic], tags: [no_name]}
  - {fibre: merino, weight: Fingering, question: "What needles for fingering merino socks?", must_mention: [merino], tags: [no_name]}
  - {fibre: mohair, weight: Lace, question: "Needles for lace mohair?", must_mention: [mohair, larger needles], tags: [no_name, lace]}
  - {fibre: alpaca, weight: Sport, question: "Would sport alpaca work for a fitted sweater?", must_mention: [alpaca, grow], tags: [no_name, suitability]}
  - {fibre: linen, weight: Sport, question: "Is linen nice to knit with?", must_mention: [linen, softens], tags: [no_name]}
  - {fibre: polyester, weight: Super Bulky, question: "How do I count stitches in plush yarn?", must_mention: [markers], tags: [no_name]}
