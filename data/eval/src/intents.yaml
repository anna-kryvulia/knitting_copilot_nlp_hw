# Router eval cases (hand-written). Labels: docs/CONVENTIONS.md § Intents.
# tags: easy | indirect (no keyword) | typo | ambiguous (two intents plausible; label = what the system should do first) | context (needs project context)
# Built into data/eval/intent_cases.jsonl by scripts/build_eval_sets.py

setup:
