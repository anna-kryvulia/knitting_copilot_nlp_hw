  avoid_for: [detailed stitch patterns]
  care: "Hand wash cool, dry flat."
  blocking: "Light wet block."
  tips: ["Sheds and has a halo.", "Very warm for its weight."]

silk:
  aliases: [silk, mulberry silk, tussah silk]
  elasticity: low
  warmth: medium
  drape: high
  needle_adjust_mm: -0.25
  good_for: [shawls, drapey tops, lace]
  avoid_for: [ribbing]
  care: "Hand wash cool, dry flat."
  blocking: "Wet block; holds lace shape well."
  tips: ["Adds sheen and strength to blends."]

cashmere:
  aliases: [cashmere]
  elasticity: medium
  warmth: high
  drape: medium
  needle_adjust_mm: 0
  good_for: [luxury accessories]
  avoid_for: [hard-wearing items]
  care: "Hand wash cool, dry flat."
  blocking: "Gentle wet block."
  tips: ["Pills with friction; best for accessories."]
