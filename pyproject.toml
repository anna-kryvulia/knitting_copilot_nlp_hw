[project]
name = "knit-copilot"
version = "0.1.0"
description = "Knitting Copilot: pattern parsing, explanation, gauge adjustment, yarn advice, charts and row tracking"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.42,<4",
    "langgraph>=1.2,<1.3",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0",
    "rank-bm25==0.2.2",
    "sentence-transformers>=6.2,<7",
    "numpy>=2.0",
    "streamlit>=1.66,<2",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
